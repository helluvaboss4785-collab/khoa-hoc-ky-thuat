# =====================================================================
# config.yaml - HẰNG SỐ VẬT LÍ, HÌNH HỌC, NGƯỠNG
# Mọi giá trị dưới đây là XẤP XỈ / GIẢ ĐỊNH, KHÔNG phải kết quả đo.
# Phải xác nhận bằng tài liệu tham khảo và đường chuẩn thực nghiệm.
# =====================================================================
quang_hoc:
  goc_dinh_A_do: 40.0            # góc đỉnh lăng kính (độ) - cấu hình được
  khoang_cach_man_D_m: 1.0       # tổng quãng đường từ lăng kính tới màn (m) - cần đo lại
  chiet_suat_nuoc_ngot: 1.333    # n nước ngọt - cần xác nhận bằng tài liệu và đường chuẩn thực nghiệm
  dn_dS_moi_phan_nghin: 1.8e-4   # dn/dS (mỗi ‰) - cần xác nhận bằng tài liệu và đường chuẩn thực nghiệm
  dn_dT_moi_do_C: -1.1e-4        # xấp xỉ từ công thức Quan–Fry tại 650 nm, 25 °C, S = 0; chưa đối chiếu bài gốc
  nhiet_do_chuan_chiet_suat_C: 20.0  # GIẢ ĐỊNH, cần thay bằng giá trị đo được: nhiệt độ ứng với n = 1,333
  bien_an_toan_TIR: 0.02         # cảnh báo khi n*sin(A) > 1 - biên này (gần phản xạ toàn phần)
  mo_hinh_chiet_suat: "tuyen_tinh"  # "tuyen_tinh" (mặc định) hoặc "quan_fry"
  buoc_song_nm: 650.0            # bước sóng laser đỏ (nm) dùng cho mô hình Quan-Fry

anh:
  kich_thuoc_pixel_mm: 0.05      # GIẢ ĐỊNH để vẽ biểu đồ - PHẢI đo lại bằng thước đặt trên màn

phan_tich_sai_so:                # GIẢ ĐỊNH đầu vào cho ngân sách sai số, KHÔNG phải số đo
  sai_so_tim_tam_px: 0.05        # độ lệch chuẩn của Δy do tìm tâm (px) - sẽ lấy từ Cột mốc 2/3
  lech_nhiet_do_hai_ngan_C: 0.5  # chênh nhiệt độ giữa hai ngăn (°C) - cần đo
  sai_so_goc_A_do: 0.05          # sai số góc A (độ) - cần đo
  troi_laser_chung_px: 5.0       # trôi chung của cả hai vạch (px) - cần đo
  he_so_triet_chung: 0.01        # phần trôi chung còn lọt vào Δy sau đo vi sai (0..1) - cần đo

xu_ly_anh:                       # Tham số thuật toán tìm tâm và đánh giá chất lượng ảnh
  nguong_bao_hoa: 250            # mức xám coi là bão hòa (trên thang 0-255)
  ti_le_bao_hoa_toi_da: 0.02     # tỉ lệ cột bão hòa cục bộ bắt đầu cảnh báo cẩn thận (2%)
  ti_le_cot_bao_hoa_nghiem_trong: 0.30  # GIẢ ĐỊNH, cần chỉnh bằng ảnh thật (vượt mức này -> hop_le=False)
  so_cot_lien_tiep_bao_hoa: 15   # GIẢ ĐỊNH, cần chỉnh bằng ảnh thật (đoạn cột bão hòa liên tiếp ≥ 15 -> bẹt đỉnh thực sự)
  nguong_nen_khong_deu: 30.0     # GIẢ ĐỊNH, cần chỉnh bằng ảnh thật (biến thiên nền hình thái p95-p5 > ngưỡng -> cảnh báo nền không đều)
  nguong_on_dinh_nhiet_px_moi_phut: 0.05  # GIẢ ĐỊNH, cần chỉnh bằng ảnh thật (độ dốc còn lại |dΔy/dt| <= ngưỡng -> đã ổn định nhiệt)
  nguong_lech_tam_meo_ti_le: 0.30        # GIẢ ĐỊNH, cần chỉnh bằng ảnh thật (tỉ lệ lệch đứng khỏi tâm ảnh > ngưỡng -> cảnh báo vùng méo ống kính)
  he_so_meo_k1_khai_bao: null            # Hệ số méo k1 khai báo tùy chọn (mặc định null = chỉ thông tin)
  bat_sua_meo_ong_kinh: false            # TẮT mặc định: chỉ bật cv2.undistort khi có file bàn cờ theo id_dien_thoai
  thu_muc_hieu_chuan_ong_kinh: "data/ong_kinh"
  snr_toi_thieu: 10.0            # tỉ số tín hiệu / nhiễu tối thiểu (giá trị mặc định, cần xác nhận bằng dữ liệu đo thật)
  r2_gauss_toi_thieu: 0.80       # hệ số xác định R² tối thiểu khi khớp Gauss
  fwhm_toi_thieu_px: 1.5         # độ rộng FWHM tối thiểu (px)
  fwhm_toi_da_px: 60.0           # độ rộng FWHM tối đa (px)
  phuong_phap_mac_dinh: "gauss"  # "gauss" (khớp Gauss) hoặc "centroid" (trọng tâm)
  kenh_laser: "auto"             # "auto" | "R" | "G" | "B" | "xam" | "Y" (ưu tiên kênh tương phản cao nhất, hòa ưu tiên R)

gioi_han:                        # Giới hạn đầu vào bảo vệ bộ nhớ/server (Q8)
  dung_luong_anh_MB: 25          # GIẢ ĐỊNH, giới hạn dung lượng mỗi ảnh tải lên (MB)
  so_khung_toi_da: 60            # GIẢ ĐỊNH, số khung tối đa trong đo đa khung
  so_megapixel_toi_da: 60        # GIẢ ĐỊNH, độ phân giải tối đa mỗi ảnh (triệu pixel)

hieu_chuan:                      # Tham số dựng đường chuẩn (Cột mốc 4)
  ti_le_tap_test: 0.25           # tỉ lệ điểm giữ lại làm tập kiểm tra (không dùng để khớp)
  so_fold_kiem_dinh_cheo: 5      # số phần (fold) khi kiểm định chéo
  nguong_cai_thien_bac2: 0.10    # chỉ chọn bậc 2 khi RMSE kiểm định chéo giảm ≥ 10% so với bậc 1 (chống quá khớp)
  he_so_phu_k: 2.0               # bất định mở rộng U = k·u (k = 2 ≈ 95% nếu sai số phân bố chuẩn)
  sai_so_nhiet_ke_C: 0.5         # GIẢ ĐỊNH độ chính xác nhiệt kế - PHẢI lấy từ thông số nhiệt kế thật
  nguong_lech_T_khong_bu_C: 1.0  # cảnh báo nếu đường chuẩn không có bù nhiệt mà T lệch quá ngưỡng này
  nguong_lech_T_hai_ngan_C: 0.5  # cảnh báo nếu |T_mau - T_tham_chieu| vượt ngưỡng này (°C)
  sigma_D_khi_chua_do_C: 2.0     # GIẢ ĐỊNH thận trọng cho chênh nhiệt hai ngăn khi chưa đo; thay bằng giá trị đo được sau khi khảo sát ΔT điển hình giữa hai ngăn
  ap_dung_hieu_chinh_ly_thuyet_D: false  # GIẢ ĐỊNH, cần thay bằng giá trị đo được (mặc định TẮT: chỉ bật nếu chấp nhận hiệu chỉnh S bằng ∂S/∂D lí thuyết khi mô hình chưa học D)
  cho_phep_giam_sigma_D_khi_on_dinh: false  # GIẢ ĐỊNH, cần thay bằng giá trị đo được (mặc định TẮT: chỉ bật khi chấp nhận giả định cân bằng nhiệt giúp giảm σ_D)
  sigma_D_khi_da_on_dinh_C: 1.0  # GIẢ ĐỊNH, cần thay bằng giá trị đo được (°C khi chuỗi Δy(t) đã ổn định đủ lâu)
  thoi_gian_on_dinh_toi_thieu_phut: 5.0  # GIẢ ĐỊNH, cần thay bằng giá trị đo được (số phút theo dõi ổn định tối thiểu để giảm σ_D)
  nguong_bien_thien_px_per_mm_phan_tram: 2.0  # GIẢ ĐỊNH, cần thay bằng giá trị đo được (biến thiên px/mm vượt ngưỡng % này -> cảnh báo khi dựng đường chuẩn theo px)
  sai_so_dung_dich_chuan_ppt: null  # bất định chuẩn của dung dịch NaCl chuẩn (‰) - để null khi chưa khai báo
  nhiet_do_toi_thieu_phu_C: null    # dải nhiệt độ tối thiểu cần phủ khi hiệu chuẩn (°C) - để người dùng đặt
  dai_man_muc_tieu_ppt: [0.0, 35.0]  # GIẢ ĐỊNH, cần thay bằng giá trị đo được
  nhiet_ke_cheo:
    so_cap_toi_thieu: 6             # GIẢ ĐỊNH, cần thay bằng giá trị đo được
    so_muc_nhiet_toi_thieu: 2       # GIẢ ĐỊNH, cần thay bằng giá trị đo được
  seed: 0                        # hạt giống ngẫu nhiên để chia train/test tái lập được

thiet_ke_thi_nghiem:
  so_muc_man_toi_thieu: 6          # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  phai_co_muc_0: true              # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  ti_le_phu_dai_man_toi_thieu: 0.8 # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  so_lan_lap_toi_thieu_moi_o: 3   # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  so_me_pha_toi_thieu: 2           # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  so_muc_nhiet_toi_thieu: 3        # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  bien_do_nhiet_toi_thieu_C: 6.0   # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  so_muc_D_toi_thieu_neu_hoc_D: 2  # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  chenh_D_toi_thieu_C: 1.0         # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)
  ti_le_toi_da_moi_muc: 0.4        # GIẢ ĐỊNH, cần thay bằng giá trị đo được (chỉnh cùng giáo viên)


