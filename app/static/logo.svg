<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="128" height="128" rx="24" />
    </clipPath>
    <linearGradient id="amberWave" x1="68" y1="52" x2="128" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#FBBF49" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="coralWave" x1="72" y1="66" x2="128" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.84" />
    </linearGradient>
  </defs>

  <g clip-path="url(#badgeClip)">
    <!-- Nền sáng tinh gọn -->
    <rect x="0" y="0" width="128" height="128" fill="#EEF3F7" />

    <!-- Lăng kính tinh thể đa diện màu xanh lam đậm -->
    <!-- Mặt ngoài trên -->
    <polygon points="64,27 31,82 46,72 64,46" fill="#0B2A66" />
    <polygon points="64,27 64,46 82,72 97,82" fill="#1D52A8" />

    <!-- Mặt lõi trên -->
    <polygon points="64,46 46,72 64,72" fill="#05163B" />
    <polygon points="64,46 64,72 82,72" fill="#123D8A" />

    <!-- Mặt cánh giữa -->
    <polygon points="31,82 46,72 50,82" fill="#0A265C" />
    <polygon points="97,82 82,72 78,82" fill="#164698" />
    <polygon points="46,72 64,72 50,82" fill="#08204E" />
    <polygon points="64,72 82,72 78,82" fill="#113B84" />

    <!-- Mặt đáy dưới -->
    <polygon points="31,82 50,82 64,100" fill="#041130" />
    <polygon points="50,82 64,72 64,100" fill="#071D47" />
    <polygon points="64,72 78,82 64,100" fill="#154699" />
    <polygon points="78,82 97,82 64,100" fill="#0B2963" />

    <!-- Sống dọc chính giữa lăng kính -->
    <line x1="64" y1="27" x2="64" y2="100" stroke="#2563EB" stroke-opacity="0.55" stroke-width="0.9" />

    <!-- Hai tia xanh ngọc đi vào từ bên trái và khúc xạ qua lăng kính -->
    <path d="M -2 72 L 48 56 L 64 52 L 69 53 L 69 57 L 64 56 L 49 60 L -2 76 Z" fill="#1CE8F8" fill-opacity="0.92" />
    <path d="M -2 82 L 44 66 L 64 64 L 73 65 L 73 70 L 64 69 L 45 71 L -2 87 Z" fill="#14DCF0" fill-opacity="0.90" />

    <!-- Hai dải sóng tán sắc vàng cam & đỏ cam ló ra bên phải -->
    <path d="M 69 52 C 86 50, 98 58, 110 54 C 118 51, 123 48, 130 48 L 130 70 C 120 71, 112 66, 102 62 C 92 58, 80 57, 69 57 Z" fill="url(#amberWave)" />
    <path d="M 73 65 C 88 66, 102 74, 115 73 C 122 72, 126 70, 130 69 L 130 87 C 120 86, 108 82, 96 76 C 85 71, 79 70, 73 70 Z" fill="url(#coralWave)" />
  </g>
</svg>
