<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="tileFace" x1="14" y1="8" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#143766" />
      <stop offset="55%" stop-color="#0B1D3A" />
      <stop offset="100%" stop-color="#050D1A" />
    </linearGradient>
    <linearGradient id="tileRim" x1="12" y1="6" x2="116" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="prismTop" x1="34" y1="22" x2="92" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="prismFront" x1="34" y1="28" x2="86" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="52%" stop-color="#14B8A6" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="waterDrop" x1="50" y1="44" x2="68" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.92" />
    </linearGradient>
    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowMint" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.1" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Đế 2.5D của huy hiệu -->
  <rect x="10" y="16" width="108" height="104" rx="26" fill="#030712" />
  <rect x="10" y="12" width="108" height="104" rx="26" fill="#1E293B" />

  <!-- Mặt chính huy hiệu 2.5D -->
  <rect x="10" y="8" width="108" height="104" rx="26" fill="url(#tileFace)" stroke="url(#tileRim)" stroke-width="2.2" />

  <!-- Lưới tọa độ quang học mờ -->
  <path d="M26 36 H102 M26 60 H102 M26 84 H102" stroke="#38BDF8" stroke-opacity="0.09" stroke-width="1" />
  <path d="M40 22 V98 M64 22 V98 M88 22 V98" stroke="#38BDF8" stroke-opacity="0.09" stroke-width="1" />

  <!-- Tia laser đỏ đi vào vuông góc mặt trái lăng kính -->
  <line x1="16" y1="54" x2="36" y2="54" stroke="#FF4D4F" stroke-width="4.2" stroke-linecap="round" filter="url(#glowRed)" />
  <line x1="16" y1="68" x2="36" y2="68" stroke="#FF4D4F" stroke-width="4.2" stroke-linecap="round" filter="url(#glowRed)" />
  <line x1="16" y1="54" x2="36" y2="54" stroke="#FECACA" stroke-width="1.4" stroke-linecap="round" />
  <line x1="16" y1="68" x2="36" y2="68" stroke="#FECACA" stroke-width="1.4" stroke-linecap="round" />

  <!-- Khối lăng kính 2.5D hai ngăn -->
  <!-- Cạnh vát đỉnh 2.5D -->
  <polygon points="36,27 46,20 92,53 82,60" fill="url(#prismTop)" stroke="#BAE6FD" stroke-width="1.3" stroke-linejoin="round" />
  <!-- Mặt đáy 2.5D -->
  <polygon points="36,95 82,60 92,53 46,88" fill="#0369A1" fill-opacity="0.28" stroke="#38BDF8" stroke-width="1.1" stroke-linejoin="round" />
  <!-- Mặt trước lăng kính tam giác -->
  <polygon points="36,27 36,95 82,60" fill="url(#prismFront)" stroke="#7DD3FC" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Vách ngăn hai buồng quang học (nước cất / mẫu) -->
  <line x1="36" y1="60" x2="82" y2="60" stroke="#E2E8F0" stroke-width="1.8" stroke-dasharray="3 2.5" />

  <!-- Giọt nước cách điệu bên trong lăng kính -->
  <path d="M52 46 C52 46 61 57 61 63.5 C61 68.5 57 72.5 52 72.5 C47 72.5 43 68.5 43 63.5 C43 57 52 46 52 46 Z"
        fill="url(#waterDrop)" stroke="#CCFBF1" stroke-width="1.3" />
  <path d="M48 61 C47.5 64.5 49 67.5 51.5 68.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Hai tia ló vi sai tách góc sau lăng kính -->
  <!-- Tia tham chiếu (nước cất 0‰) -->
  <line x1="72" y1="53" x2="108" y2="41" stroke="#34D399" stroke-width="3.6" stroke-linecap="round" filter="url(#glowMint)" />
  <line x1="72" y1="53" x2="108" y2="41" stroke="#D1FAE5" stroke-width="1.2" stroke-linecap="round" />

  <!-- Tia mẫu (nước mặn S‰ lệch góc xuống dưới) -->
  <line x1="72" y1="68" x2="108" y2="83" stroke="#FF4D4F" stroke-width="4" stroke-linecap="round" filter="url(#glowRed)" />
  <line x1="72" y1="68" x2="108" y2="83" stroke="#FEE2E2" stroke-width="1.3" stroke-linecap="round" />

  <!-- Thanh đo khoảng lệch vi sai Δy nổi bật bên phải -->
  <line x1="108" y1="45" x2="108" y2="79" stroke="#FDE047" stroke-width="2.2" stroke-dasharray="3 2.5" />
  <circle cx="108" cy="41" r="4.2" fill="#34D399" stroke="#064E3B" stroke-width="1.5" />
  <circle cx="108" cy="83" r="4.2" fill="#FF4D4F" stroke="#7F1D1D" stroke-width="1.5" />

  <!-- Huy hiệu Δy nhỏ gọn góc phải -->
  <rect x="85" y="53" width="20" height="15" rx="4.5" fill="#0B1D3A" stroke="#FDE047" stroke-width="1.4" />
  <text x="95" y="64" fill="#FDE047" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Δy</text>
</svg>
